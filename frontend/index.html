<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="School Online — Онлайн платформа школьного образования: классы, расписание, журнал оценок, виртуальный кабинет">
    <title>School Online — Школьный Портал</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="app-root">
        <!-- Header / Navbar Container -->
        <header id="navbar-container" class="navbar-header"></header>

        <!-- Main Content Area -->
        <main id="main-content" class="main-container">
            <div class="loading-spinner-wrapper" id="global-loader">
                <div class="spinner"></div>
                <p>Загрузка системы...</p>
            </div>
        </main>

        <!-- Toast Notifications Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Universal Modal Container -->
        <div id="modal-container" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h3 id="modal-title">Заголовок</h3>
                    <button id="modal-close-btn" class="icon-btn" aria-label="Закрыть">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
                <div id="modal-footer" class="modal-footer"></div>
            </div>
        </div>
    </div>

    <!-- Application Script Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
