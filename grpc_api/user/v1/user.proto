syntax = "proto3";


package school_online.user.v1;

option go_package = "github.com/abozorov/school_online/grpc_api/user;v1";

service UserService {
        rpc Get(GetUserRequest) returns (GetUserResponse);
        rpc GetAll(GetAllUsersRequest) returns (GetAllUsersResponse);
        rpc Create(CreateUserRequest) returns (CreateUserResponse);
        rpc Update(UpdateUserRequest) returns (UpdateUserResponse);
        rpc Delete(DeleteUserRequest) returns (DeleteUserResponse);
        rpc CreateSubject(CreateSubjectRequest) returns (CreateSubjectResponse);
        rpc UpdateSubject(UpdateSubjectRequest) returns (UpdateSubjectResponse);
}

message UpdateSubjectRequest {
        int32 id = 1;
        optional string name = 2;
        optional string description = 3;
}

message UpdateSubjectResponse {
}

message CreateSubjectRequest {
        string name = 1;
        string description = 2;
}

message CreateSubjectResponse {
        int32 id = 1;
}

message DeleteUserRequest {
        int32 id = 1;
}

message DeleteUserResponse {
}

message UpdateUserRequest {
        int32 id = 1;
        optional string name = 2;
        optional string username = 3;
        optional string phone_number = 4;
        optional string role = 5;
        optional string birthday = 6;
        optional Student student = 7;
        optional Parrent parrent = 8;
        optional Stuff stuff = 9;
        optional Teacher teacher = 10;
}

message UpdateUserResponse {
}

message CreateUserRequest {
        string name = 1;
        string username = 2;
        string email = 3;
        string phone_number = 4;
        string role = 5;
        string birthday = 6;
        Student student = 7;
        Parrent parrent = 8;
        Stuff stuff = 9;
        Teacher teacher = 10;
}

message CreateUserResponse {
        int32 id = 1;
}

message GetAllUsersRequest {
}

message GetAllUsersResponse {
        repeated GetUserResponse users = 1;
}

message GetUserRequest {
        int32 id = 1;
}

message GetUserResponse {
        int32 id = 1;
        string name = 2;
        string username = 3;
        string email = 4;
        string phone_number = 5;
        string role = 6;
        string birthday = 7;
        Student student = 8;
        Parrent parrent = 9;
        Stuff stuff = 10;
        Teacher teacher = 11;
}
message Student {
        int32 id = 1;
        int32 class_is = 2;
        int32 user_if = 3;
}

message Parrent {
        int32 id = 1;
        repeated int32 students_id = 2;
        int32 user_id = 3;
}

message Stuff {
        int32 id = 1;
        string position = 2;
        int32 user_id = 3;
        int32 experience = 4;
}

message Teacher {
        int32 id = 1;
        repeated int32 subjects_id = 2;
        int32 user_id = 3;
        int32 experience = 4;
}
